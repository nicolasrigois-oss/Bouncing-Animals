<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bouncing Hippo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap">
  <style>
    /* Deliberately one look per sky; colours are set explicitly below */
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;            /* no scrollbars */
      background: #9fd8ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    canvas { position: fixed; inset: 0; display: block; touch-action: none; }

    /* ---------- THE FOUR SKIES (stacked, only one visible at a time) ---------- */
    .sky {
      position: fixed;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      overflow: hidden;
    }
    .sky.active { opacity: 1; }

    #dawn   { background: linear-gradient(#4a5d9a 0%, #b9a3d6 35%, #f6b8a8 65%, #ffd9a0 100%); }
    #midday { background: linear-gradient(#3d9be9 0%, #8cccff 55%, #d9f1ff 100%); }
    #dusk   { background: linear-gradient(#2c2a5a 0%, #7d4b8f 40%, #e0705a 75%, #f9a94b 100%); }
    #night  { background: linear-gradient(#050816 0%, #0d1b3d 60%, #1c2d5c 100%); }

    /* sun and moon */
    .orb { position: absolute; border-radius: 50%; }
    #dawn .orb   { width: 22vmin; height: 22vmin; left: 12%; bottom: -8vmin;
                   background: #ffe2a8; box-shadow: 0 0 12vmin 6vmin rgba(255,200,140,0.55); }
    #midday .orb { width: 14vmin; height: 14vmin; right: 12%; top: 10%;
                   background: #fffbe6; box-shadow: 0 0 10vmin 5vmin rgba(255,250,210,0.7); }
    #dusk .orb   { width: 24vmin; height: 24vmin; right: 10%; bottom: -10vmin;
                   background: #ffb46b; box-shadow: 0 0 14vmin 7vmin rgba(255,130,80,0.5); }
    #night .orb  { width: 11vmin; height: 11vmin; left: 14%; top: 12%;
                   background: #f4f0dc;
                   /* cut a circle out of the moon to leave a crescent */
                   -webkit-mask-image: radial-gradient(circle at 28% 30%, transparent 58%, #000 59%);
                           mask-image: radial-gradient(circle at 28% 30%, transparent 58%, #000 59%); }
    #night .moonGlow { position: absolute; width: 30vmin; height: 30vmin; left: calc(14% - 9.5vmin); top: calc(12% - 9.5vmin);
                   border-radius: 50%; background: radial-gradient(rgba(244,240,220,0.22), transparent 65%); }

    /* little clouds for daytime skies */
    .cloud {
      position: absolute; width: 26vmin; height: 7vmin; border-radius: 7vmin;
      background: rgba(255,255,255,0.75);
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; background: inherit; border-radius: 50%;
    }
    .cloud::before { width: 11vmin; height: 11vmin; left: 4vmin;  top: -5vmin; }
    .cloud::after  { width: 8vmin;  height: 8vmin;  left: 13vmin; top: -3.5vmin; }
    #dawn .cloud { background: rgba(255,214,214,0.6); }

    /* stars */
    .star {
      position: absolute; border-radius: 50%; background: #fff;
      animation: twinkle var(--t, 3s) ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }

    /* name tag that pops up when a new animal arrives */
    #nameTag {
      position: fixed; left: 0; right: 0; z-index: 2;
      top: calc(18px + env(safe-area-inset-top, 0px));
      text-align: center;
      font-family: "Fredoka", system-ui, sans-serif;
      font-weight: 600; font-size: clamp(22px, 6vmin, 40px);
      color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.35);
      opacity: 0; transform: translateY(-8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }
    #nameTag.show { opacity: 1; transform: none; }

    #hint {
      position: fixed; left: 0; right: 0; z-index: 2;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      text-align: center; font-size: 13px; letter-spacing: 0.04em;
      color: #ffffff; opacity: 0.75; pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    }

    /* ---------- speed slider, in a frosted-glass capsule ---------- */
    #speedPanel {
      position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      width: min(420px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      box-sizing: border-box;
      display: flex; align-items: center; gap: 12px;
      padding: 8px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.30), rgba(255,255,255,0.10));
      -webkit-backdrop-filter: blur(20px) saturate(180%);
              backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 10px 30px rgba(20,10,40,0.22),
                  inset 0 1px 0 rgba(255,255,255,0.65),
                  inset 0 -1px 1px rgba(255,255,255,0.18);
      color: #ffffff; font-size: 13px; letter-spacing: 0.03em;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #speedPanel label { flex: none; font-weight: 600; }
    #speedValue { flex: none; width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    #speed {
      --fill: 33.3%;
      flex: 1; min-width: 0; height: 32px; margin: 0;
      -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
    }
    #speed::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px;
      background: linear-gradient(90deg, rgba(255,255,255,0.95) var(--fill), rgba(255,255,255,0.28) var(--fill));
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.18);
    }
    #speed::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #ffffff, rgba(255,255,255,0.82));
      border: 1px solid rgba(255,255,255,0.95);
      box-shadow: 0 3px 10px rgba(20,10,40,0.3), inset 0 -2px 3px rgba(0,0,0,0.06);
      transition: transform 0.15s ease;
    }
    #speed:active::-webkit-slider-thumb { transform: scale(1.12); }
    #speed::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.28); }
    #speed::-moz-range-progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.95); }
    #speed::-moz-range-thumb {
      width: 28px; height: 28px; border-radius: 50%; background: #ffffff;
      border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 3px 10px rgba(20,10,40,0.3);
    }
    #speed:focus-visible { outline: none; }
    #speed:focus-visible::-webkit-slider-thumb { outline: 3px solid #ffd27a; outline-offset: 2px; }
    #speed:focus-visible::-moz-range-thumb { outline: 3px solid #ffd27a; outline-offset: 2px; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      #speedPanel { background: rgba(40,30,70,0.55); }
    }

    body { touch-action: none; }   /* swipes move Hip instead of scrolling the page */

    /* ---------- opening prompt ---------- */
    #intro {
      position: fixed; left: 0; right: 0; z-index: 2;
      top: calc(5% + env(safe-area-inset-top, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      text-align: center; color: #ffffff; pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #intro.gone { opacity: 0; transform: translateY(-10px); }
    #intro h1 {
      margin: 0; font-family: "Fredoka", system-ui, sans-serif; font-weight: 600;
      font-size: clamp(24px, 6.5vmin, 46px); line-height: 1.15; text-wrap: balance;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }
    #intro p {
      margin: 0; font-size: clamp(14px, 3.2vmin, 18px); letter-spacing: 0.02em;
      opacity: 0.9; text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    .introRow { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; }
    .swipeDemo { position: relative; width: 120px; height: 48px; flex: none; }
    .swipeDemo .trail {
      position: absolute; left: 18px; top: 32px; width: 84px; height: 4px; border-radius: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.8));
      transform-origin: left center; transform: rotate(-22deg);
      animation: trail 1.6s ease-in-out infinite;
    }
    .swipeDemo svg {
      position: absolute; left: 6px; top: 16px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
      animation: swipe 1.6s ease-in-out infinite;
    }
    @keyframes swipe {
      0%   { transform: translate(0, 0) scale(1);          opacity: 0; }
      15%  { transform: translate(0, 0) scale(0.92);       opacity: 1; }
      70%  { transform: translate(76px, -30px) scale(0.92); opacity: 1; }
      100% { transform: translate(84px, -34px) scale(1);   opacity: 0; }
    }
    @keyframes trail {
      0%, 15% { clip-path: inset(0 100% 0 0); opacity: 0; }
      70%     { clip-path: inset(0 0 0 0);    opacity: 1; }
      100%    { clip-path: inset(0 0 0 0);    opacity: 0; }
    }

    #soundBtn {
      position: fixed; z-index: 3;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center; padding: 0;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(20,18,40,0.35); color: #ffffff;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #soundBtn:hover { background: rgba(20,18,40,0.5); }
    #soundBtn:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .swipeDemo svg, .swipeDemo .trail { animation: none; }
      .swipeDemo svg { transform: translate(40px, -14px); }
      .star { animation: none; }
      .sky { transition-duration: 0.4s; }
    }
  </style>
</head>
<body>
  <div class="sky active" id="dawn">
    <div class="orb"></div>
    <div class="cloud" style="left: 60%; top: 22%;"></div>
  </div>
  <div class="sky" id="midday">
    <div class="orb"></div>
    <div class="cloud" style="left: 8%;  top: 18%;"></div>
    <div class="cloud" style="left: 55%; top: 40%; transform: scale(0.7);"></div>
  </div>
  <div class="sky" id="dusk">
    <div class="orb"></div>
  </div>
  <div class="sky" id="night">
    <div class="moonGlow"></div>
    <div class="orb"></div>
  </div>

  <!-- the city skyline silhouette is drawn on this canvas -->
  <canvas id="city"></canvas>

  <div id="nameTag"></div>
  <div id="intro">
    <h1>Swipe to send Hip bouncing!</h1>
    <div class="introRow">
    <div class="swipeDemo" aria-hidden="true">
      <div class="trail"></div>
      <svg viewBox="0 0 24 24" width="40" height="40">
        <path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10l.5-.1V8.5a1.5 1.5 0 0 1 3 0v1.6l.4-.1a1.5 1.5 0 0 1 2.6 1v1.3a1.4 1.4 0 0 1 2.5.9v3.3c0 3.3-2.4 5.5-5.6 5.5h-1.6c-2 0-3.4-.8-4.6-2.4L5.3 14a1.5 1.5 0 0 1 2.2-2z"
              fill="#ffffff" stroke="#2a2440" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <p>Flick your finger in any direction</p>
    </div>
    <p id="musicNote">Tap anywhere to hear Hip's music</p>
  </div>
  <div id="hint" hidden>Tap anywhere for a new spin · the speaker button turns sound on or off</div>
  <div id="speedPanel">
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-valuetext="1.0 times">
    <span id="speedValue">1.0×</span>
  </div>
  <button id="soundBtn" type="button" aria-pressed="false" aria-label="Turn sound on">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
      <g id="iconOn" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display: none">
        <path d="M16 9.5a4 4 0 0 1 0 5"/><path d="M18.5 7a7.5 7.5 0 0 1 0 10"/>
      </g>
      <g id="iconOff" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>
      </g>
    </svg>
  </button>

  <!-- Three.js: the library that draws 3D in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ============================================================
    //  SETTINGS - play with these!
    // ============================================================
    const SPEED       = 3.0 / (1.21 * 1.2); // lower = faster (two 10% speed-ups, then +20%, on the original 3.0)
    const SPIN_MAX    = 2.5;   // fastest spin per axis
    const ANIMAL_SIZE = 0.15;  // animal size as a share of the smaller screen side
    const PARTY_SIZE  = 0.6;   // how big the animals are in the finale (1 = normal size)
    const PARTY_CYCLES = 2;    // how many full sky cycles the finale lasts
    const BUMP_DISTANCE = 0.62; // how close animals get before bouncing off each other
                                // (1 = outer edge of each animal's reach; lower = closer)

    // The order the skies appear in, the light each one shines on the animal,
    // the colour of the city silhouette, and how many windows are lit (0 to 1)
    const SKIES = [
      { id: 'dawn',   sky: 0xffd2c4, ground: 0x7a6aa8, sun: 0xffc59a, sunPower: 0.8,  city: 0x3d3768, windows: 0.15 },
      { id: 'midday', sky: 0xffffff, ground: 0x8a7fb0, sun: 0xffffff, sunPower: 0.9,  city: 0x5d7ea3, windows: 0 },
      { id: 'dusk',   sky: 0xffa77a, ground: 0x4a3a78, sun: 0xff9a5a, sunPower: 0.7,  city: 0x2a1b3e, windows: 0.55 },
      { id: 'night',  sky: 0x8fa6ff, ground: 0x1a1f40, sun: 0xcfd8ff, sunPower: 0.45, city: 0x070a18, windows: 1 },
    ];
    const WINDOW_COLOUR = '#ffd27a';
    const SKYLINE_HEIGHT = 0.33;   // the city fills the bottom third of the screen

    // ============================================================
    //  0. SPRINKLE STARS INTO THE NIGHT SKY
    // ============================================================
    const night = document.getElementById('night');
    for (let i = 0; i < 140; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() < 0.85 ? 1.5 : 3;
      star.style.width = star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.setProperty('--t', (1.5 + Math.random() * 3) + 's');
      star.style.animationDelay = (-Math.random() * 4) + 's';
      night.appendChild(star);
    }

    // ============================================================
    //  0b. CITY SKYLINES (Singapore and London, as silhouettes)
    //      Drawn in "city units": x = 0 is the middle of the screen,
    //      y = 0 is the ground, and 330 units = the bottom third.
    // ============================================================
    // a repeatable random number generator, so the city looks the same every time
    function seededRandom(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function makeCity(seed, buildLandmarks, style = 'towers') {
      const rnd = seededRandom(seed);
      const path = new Path2D();
      const city = { path, wheels: [], windows: [] };

      // a shape from a list of [x, y] corner points (y goes up)
      const poly = (pts) => {
        // always trace corners in the same direction, or overlapping shapes punch holes
        let area = 0;
        pts.forEach(([x1, y1], i) => { const [x2, y2] = pts[(i + 1) % pts.length]; area += x1 * y2 - x2 * y1; });
        if (area < 0) pts = pts.slice().reverse();
        path.moveTo(pts[0][0], -pts[0][1]);
        pts.slice(1).forEach(([x, y]) => path.lineTo(x, -y));
        path.closePath();
      };
      // a rectangular building; lit = it gets windows at night
      const box = (x, w, h, y0 = 0, lit = true) => {
        poly([[x, y0], [x + w, y0], [x + w, y0 + h], [x, y0 + h]]);
        if (!lit) return;
        for (let wy = y0 + 8; wy < y0 + h - 8; wy += 12)
          for (let wx = x + 4; wx < x + w - 6; wx += 9)
            if (rnd() < 0.28) city.windows.push([wx, wy]);
      };
      const dome = (cx, y, r) => {
        path.moveTo(cx + r, -y);
        path.arc(cx, -y, r, 0, Math.PI, true);
        path.closePath();
      };
      const wheel = (cx, cy, r) => city.wheels.push({ cx, cy, r });

      if (style === 'paris') {
        // Paris: rows of low apartment blocks with sloping roofs and chimneys
        for (let x = -2400; x < 2400;) {
          const w = 28 + rnd() * 34, h = 28 + rnd() * 16;
          box(x, w, h);
          poly([[x, h], [x + w, h], [x + w - 5, h + 10], [x + 5, h + 10]]);   // mansard roof
          if (rnd() < 0.7) box(x + 6 + rnd() * (w - 16), 4, 6, h + 9, false); // chimney
          x += w + rnd() * 3;
        }
      } else {
        // ordinary buildings all along the ground (lower in the middle so landmarks stand out)
        for (let x = -2400; x < 2400;) {
          const w = 18 + rnd() * 40;
          const low = Math.abs(x) < 420;
          const h = low ? 18 + rnd() * 45 : 30 + rnd() * 95;
          box(x, w, h);
          x += w + rnd() * 5;
        }
      }
      buildLandmarks({ poly, box, dome, wheel, path });
      return city;
    }

    const CITIES = {
      // ---------------- SINGAPORE ----------------
      singapore: makeCity(7, ({ poly, box, wheel }) => {
        // office towers of the CBD
        box(-440, 40, 230); box(-395, 30, 268); box(-360, 36, 205);
        box(-318, 28, 248); box(-286, 34, 182);
        // Supertrees of Gardens by the Bay
        [[-250, 85], [-228, 108], [-206, 72]].forEach(([x, h]) =>
          poly([[x - 2, 0], [x + 2, 0], [x + 2, h - 16], [x + 14, h], [x - 14, h], [x - 2, h - 16]]));
        // ArtScience Museum: a lotus of upturned "fingers"
        box(-182, 20, 24, 0, false);
        for (let i = 0; i < 7; i++) {
          const a = (-60 + i * 20) * Math.PI / 180, cx = -172, cy = 22, L = 60;
          const s = Math.sin(a), c = Math.cos(a);
          const tx = cx + s * L, ty = cy + c * L;
          poly([[cx - c * 7, cy + s * 7], [tx - c * 3, ty + s * 3], [tx + c * 3, ty - s * 3], [cx + c * 7, cy - s * 7]]);
        }
        // Marina Bay Sands: three towers and the SkyPark "ship" on top
        [-72, -18, 36].forEach(x => {
          poly([[x - 3, 0], [x + 39, 0], [x + 36, 200], [x, 200]]);
          box(x + 2, 32, 190, 4);   // just to add windows
        });
        poly([[-106, 200], [110, 200], [134, 214], [-106, 215]]);
        // Singapore Flyer: the giant wheel
        box(190, 95, 22, 0, false);
        poly([[208, 0], [214, 0], [237, 105], [233, 105]]);
        poly([[256, 0], [262, 0], [237, 105], [233, 105]]);
        wheel(235, 107, 72);
        // more towers to the right
        box(330, 34, 192); box(368, 26, 150); box(398, 40, 214); box(445, 30, 170);
      }),

      // ---------------- LONDON ----------------
      london: makeCity(42, ({ poly, box, dome, wheel, path }) => {
        box(-470, 40, 120);
        // Houses of Parliament, with the Victoria Tower at one end
        box(-360, 200, 55);
        for (let x = -350; x < -170; x += 16) poly([[x, 55], [x + 6, 55], [x + 3, 70]]);
        box(-374, 36, 140, 0, false);
        poly([[-374, 140], [-338, 140], [-356, 162]]);
        // Elizabeth Tower (Big Ben)
        box(-182, 24, 150);
        box(-186, 32, 34, 150, false);   // the clock
        box(-182, 24, 22, 184, false);   // the belfry
        poly([[-185, 206], [-155, 206], [-170, 252]]);
        // London Eye
        box(-80, 80, 10, 0, false);
        poly([[-124, 0], [-114, 0], [-38, 92], [-44, 96]]);
        wheel(-40, 94, 78);
        // St Paul's Cathedral
        box(50, 80, 45);
        box(65, 50, 30, 45, false);
        dome(90, 75, 26);
        box(86, 8, 20, 99, false);
        poly([[88, 119], [92, 119], [90, 134]]);
        // The Shard
        poly([[180, 0], [250, 0], [222, 284], [218, 302], [213, 280]]);
        // The Gherkin
        path.moveTo(320, 0);
        path.bezierCurveTo(330, -60, 316, -140, 300, -166);
        path.bezierCurveTo(284, -140, 270, -60, 280, 0);
        path.closePath();
        // The Walkie-Talkie (wider at the top)
        poly([[340, 0], [372, 0], [380, 150], [334, 155]]);
        box(400, 30, 175); box(436, 40, 130);
      }),

      // ---------------- PARIS ----------------
      paris: makeCity(1889, ({ poly, box, dome }) => {
        // Notre-Dame: two square towers, the nave and its spire
        box(-372, 26, 122); box(-332, 26, 122);
        box(-346, 14, 100, 0, false);
        box(-306, 58, 76);
        poly([[-306, 76], [-248, 76], [-248, 88], [-306, 92]]);
        poly([[-274, 86], [-266, 86], [-270, 172]]);
        // Arc de Triomphe
        box(-245, 35, 110); box(-170, 35, 110);
        poly([[-210, 85], [-204, 98], [-197, 106], [-190, 109], [-190, 111], [-210, 111]]);

    function startAudio() {
      if (!audio) {
        const AC = window.AudioContext || window.webkitAudioContext;

        // on iPhone, ask for "playback" sound so it still plays when the silent switch is on
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        audio = new AC();
        const comp = audio.createDynamicsCompressor();   // keeps loud moments from crackling
        master = audio.createGain();
        master.gain.value = SOUND_VOLUME;
        master.connect(comp).connect(audio.destination);
        musicBus = audio.createGain();
        musicBus.gain.value = MUSIC_VOLUME;
        musicBus.connect(master);

        noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);   // 1 second of hiss
        const d = noiseBuf.getChannelData(0);

      if (audio.state === 'suspended') audio.resume();

      const blip = audio.createBufferSource();
      blip.buffer = audio.createBuffer(1, 1, 22050);
      blip.connect(audio.destination);
      blip.start(0);

      g.gain.setValueAtTime(0.0001, t);

      lastSqueak = t;

      o.type = 'triangle';

    const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

    function playTone(dest, t, hz, dur, inst) {
      const out = audio.createGain(), lp = audio.createBiquadFilter();

      if (inst.percussive) {

    function drum(dest, t, kind) {
      const g = audio.createGain();
      g.connect(dest);
      if (kind === 'kick') {
        const o = audio.createOscillator();
        o.frequency.setValueAtTime(160, t);
        o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
        envelope(g, t, 0.8, 0.003, 0.22);
        o.connect(g); o.start(t); o.stop(t + 0.3);
      } else {
        const f = audio.createBiquadFilter();
        f.type = kind === 'snare' ? 'highpass' : kind === 'clap' ? 'bandpass' : 'highpass';
        f.frequency.value = kind === 'snare' ? 1400 : kind === 'clap' ? 1600 : 7000;
        const len = { snare: 0.13, clap: 0.1, hat: 0.035, open: 0.16 }[kind];
        const peak = { snare: 0.35, clap: 0.3, hat: 0.12, open: 0.1 }[kind];

      (song.byStep[step] || []).forEach(([, n, len]) => {

    // runs every 25 ms: picks the right tune and schedules the next few notes ahead of time

      const now = audio.currentTime;

          old.gain.linearRampToValueAtTime(0, now + 0.8);

          g.connect(musicBus);
          music.gain = g; music.step = 0; music.next = now + 0.05; music.t0 = music.next;
        }

      if (!music.name) return;
      const song = SONGS[music.name];
      while (music.next < now + 0.12) {
        playStep(song, music.step, music.next, music.gain);
        music.step = (music.step + 1) % 64;
        music.next += 60 / song.bpm / 4;

    const speedPanel = document.getElementById('speedPanel');
    ['pointerdown', 'pointerup', 'pointermove'].forEach(type =>
      speedPanel.addEventListener(type, e => e.stopPropagation()));

    // ============================================================
    //  0b3. HAPTICS: a light tap on the walls, a double thump when animals collide
    //  Android phones vibrate; iPhones have no vibration for web pages, so we
    //  use the tiny "tick" iOS plays when a switch is flipped (best effort).
    // ============================================================
    const canVibrate = typeof navigator.vibrate === 'function';
    // iPhone (Safari 18+): flipping a hidden switch makes the phone tick.
    // A fresh switch is made for every tick, the way that is known to work.
    const iosTick = canVibrate ? null : () => {
      try {
        const label = document.createElement('label');
        label.setAttribute('aria-hidden', 'true');
        label.style.display = 'none';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.setAttribute('switch', '');
        label.appendChild(input);
        document.head.appendChild(label);
        label.click();
        document.head.removeChild(label);
      } catch (e) {}
    };
    let lastBuzz = 0;
    function buzz(pattern, ticks) {
      const t = performance.now();
      if (t - lastBuzz < 90) return;   // don't buzz non-stop when lots happen at once
      lastBuzz = t;
      if (canVibrate) { try { navigator.vibrate(pattern); } catch (e) {} return; }
      if (iosTick) {
        iosTick();
        for (let i = 1; i < ticks; i++) setTimeout(iosTick, i * 80);
      }
    }
    function hapticWall() { buzz(12, 1); }             // short, light tap
    function hapticBump() { buzz([28, 45, 28], 2); }   // softer double thump

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('pointerdown', e => e.stopPropagation());   // don't count as a spin tap
    function setSound(on) {
      soundOn = on;
      soundBtn.setAttribute('aria-pressed', String(on));
      soundBtn.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
      document.getElementById('iconOn').style.display = on ? '' : 'none';
      document.getElementById('iconOff').style.display = on ? 'none' : '';
      document.getElementById('musicNote').hidden = on || userMuted;
    }
    soundBtn.addEventListener('click', () => {
      const on = !soundOn && startAudio();
      userMuted = !on;
      setSound(on);
      if (on) squeak(1);   // a little hello so you know it works
    });

    // ============================================================
    //  0c. THE NIGHT ROCKET
    //      Each night it launches from a random spot at the bottom
    //      and curves away towards a random top corner.
    // ============================================================
    const ROCKET_TIME = 2.6;   // seconds to cross the sky
    const rocket = { active: false, t: 0, start: null, ctrl: null, end: null, puffs: [] };

    function launchRocket() {
      const W = innerWidth, H = innerHeight;
      const L = Math.min(W, H) * 0.13;                    // rocket length in pixels
      const toRight = Math.random() < 0.5;
      rocket.size = L;
      rocket.start = { x: W * (0.1 + Math.random() * 0.8), y: H + L };
      rocket.end   = { x: toRight ? W + L : -L, y: -L };
      rocket.ctrl  = { x: rocket.start.x, y: H * 0.35 };  // makes the path curve
      rocket.t = 0;
      rocket.active = true;
      rocketSound();
    }

    // a point along the curved path (t goes 0 → 1), and the direction of travel
    function rocketPoint(t) {
      const { start: a, ctrl: c, end: b } = rocket;
      const u = 1 - t;
      return {
        x: u * u * a.x + 2 * u * t * c.x + t * t * b.x,
        y: u * u * a.y + 2 * u * t * c.y + t * t * b.y,
        dx: 2 * u * (c.x - a.x) + 2 * t * (b.x - c.x),
        dy: 2 * u * (c.y - a.y) + 2 * t * (b.y - c.y),
      };
    }

    // the rocket itself, drawn pointing "up" on a 100-unit-long body
    function drawRocketShape(ctx, time) {
      // flames (they flicker)
      const f = 34 + Math.sin(time * 45) * 6 + Math.random() * 8;
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath();
      ctx.moveTo(-11, 44); ctx.quadraticCurveTo(-14, 44 + f * 0.6, 0, 44 + f);
      ctx.quadraticCurveTo(14, 44 + f * 0.6, 11, 44); ctx.fill();
      ctx.fillStyle = '#ffd84a';
      ctx.beginPath();
      ctx.moveTo(-6, 44); ctx.quadraticCurveTo(-7, 44 + f * 0.4, 0, 44 + f * 0.65);
      ctx.quadraticCurveTo(7, 44 + f * 0.4, 6, 44); ctx.fill();

      // nozzle
      ctx.fillStyle = '#6b6f7a';
      ctx.beginPath(); ctx.moveTo(-9, 36); ctx.lineTo(9, 36); ctx.lineTo(12, 46); ctx.lineTo(-12, 46); ctx.fill();

      // red fins
      ctx.fillStyle = '#d7263d';
      ctx.beginPath(); ctx.moveTo(-13, 12); ctx.quadraticCurveTo(-34, 30, -30, 50); ctx.lineTo(-13, 38); ctx.fill();
      ctx.beginPath(); ctx.moveTo(13, 12); ctx.quadraticCurveTo(34, 30, 30, 50); ctx.lineTo(13, 38); ctx.fill();

      // white body
      const body = new Path2D();
      body.moveTo(0, -50);
      body.bezierCurveTo(18, -34, 18, 10, 13, 40);
      body.lineTo(-13, 40);
      body.bezierCurveTo(-18, 10, -18, -34, 0, -50);
      ctx.fillStyle = '#fbfbf7';
      ctx.fill(body);

      ctx.save();
      ctx.clip(body);
      ctx.fillStyle = '#d7263d';
      ctx.fillRect(-20, -55, 40, 27);          // red nose cone
      ctx.fillRect(-20, 26, 40, 6);            // red band near the bottom
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(4, -55, 20, 100);           // shading on one side
      ctx.restore();

      // porthole
      ctx.fillStyle = '#d7263d';
      ctx.beginPath(); ctx.arc(0, -8, 8.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7fc8ff';
      ctx.beginPath(); ctx.arc(0, -8, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(-1.8, -9.8, 1.8, 0, Math.PI * 2); ctx.fill();

      // dark outline round the body
      ctx.strokeStyle = 'rgba(30,20,40,0.55)';
      ctx.lineWidth = 1.5;
      ctx.stroke(body);
    }

    function drawRocket(ctx, dt, dpr) {
      if (!rocket.active && rocket.puffs.length === 0) return;
      const now = performance.now() / 1000;

      if (rocket.active) {
        rocket.t += dt / ROCKET_TIME;
        if (rocket.t >= 1) rocket.active = false;
      }
      const eased = Math.min(1, rocket.t) ** 1.6;   // starts slow, speeds up
      const p = rocketPoint(eased);

      // smoke puffs left behind the rocket
      if (rocket.active) {
        const back = Math.hypot(p.dx, p.dy) || 1;
        const s = rocket.size;
        rocket.puffs.push({ x: p.x - p.dx / back * s * 0.75, y: p.y - p.dy / back * s * 0.75, age: 0 });
      }
      rocket.puffs.forEach(q => q.age += dt);
      rocket.puffs = rocket.puffs.filter(q => q.age < 1.4);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rocket.puffs.forEach(q => {
        ctx.globalAlpha = 0.45 * (1 - q.age / 1.4);
        ctx.fillStyle = '#e8e4f0';
        ctx.beginPath();
        ctx.arc(q.x, q.y, rocket.size * (0.06 + q.age * 0.18), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      if (rocket.active) {
        const k = rocket.size / 100;
        ctx.setTransform(dpr * k, 0, 0, dpr * k, p.x * dpr, p.y * dpr);
        ctx.rotate(Math.atan2(p.dy, p.dx) + Math.PI / 2);
        drawRocketShape(ctx, now);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ============================================================
    //  0d. THE EARTH (background for the finale)
    //      Rough continent outlines as [longitude, latitude] points,
    //      projected onto a slowly turning globe.
    // ============================================================
    const CONTINENTS = [
      { grey: '#2c2f35', pts: [[-168,65],[-140,70],[-95,72],[-80,63],[-65,60],[-55,50],[-70,43],[-76,35],[-81,25],[-90,29],[-97,26],[-97,18],[-88,15],[-83,9],[-79,8],[-90,14],[-105,20],[-110,23],[-117,32],[-124,40],[-124,48],[-135,58],[-152,58],[-165,60]] }, // North America
      { grey: '#4a4e57', pts: [[-55,60],[-45,60],[-20,70],[-20,80],[-60,82],[-70,77],[-55,70]] },  // Greenland
      { grey: '#34373e', pts: [[-80,9],[-72,12],[-60,10],[-50,0],[-35,-5],[-39,-15],[-48,-26],[-58,-35],[-65,-42],[-68,-52],[-75,-50],[-74,-40],[-71,-30],[-70,-18],[-76,-14],[-81,-5],[-78,2]] }, // South America
      { grey: '#30333a', pts: [[-10,36],[-9,43],[-2,47],[-5,48],[5,54],[10,58],[5,62],[15,69],[28,71],[40,67],[60,70],[80,73],[105,78],[140,72],[170,70],[180,66],[165,60],[160,54],[140,50],[142,46],[130,42],[122,40],[121,31],[110,21],[106,10],[100,13],[103,1],[98,8],[94,16],[88,22],[80,15],[77,8],[72,20],[67,25],[57,25],[52,27],[48,30],[56,24],[58,20],[52,16],[44,12],[38,20],[34,28],[30,31],[35,36],[27,37],[24,40],[20,40],[15,38],[12,44],[8,44],[3,43],[-1,37]] }, // Europe and Asia
      { grey: '#383b42', pts: [[-17,21],[-16,13],[-8,5],[5,4],[9,4],[10,-2],[13,-10],[12,-18],[15,-27],[18,-34],[25,-34],[33,-28],[35,-20],[40,-15],[40,-5],[43,0],[51,11],[43,12],[37,20],[32,31],[20,31],[10,37],[-1,36],[-6,35],[-10,30]] }, // Africa
      { grey: '#3e4148', pts: [[114,-22],[122,-18],[130,-12],[137,-12],[142,-11],[146,-19],[153,-27],[150,-37],[141,-38],[133,-32],[123,-34],[115,-34]] }, // Australia
      { grey: '#383b42', pts: [[44,-25],[47,-25],[50,-15],[49,-12],[44,-17]] },                     // Madagascar
      { grey: '#30333a', pts: [[-5,50],[1,51],[2,53],[-3,58],[-6,57],[-5,54]] },                    // Great Britain
      { grey: '#30333a', pts: [[130,31],[135,34],[140,36],[142,40],[141,45],[139,42],[136,36],[131,34]] }, // Japan
      { grey: '#34373e', pts: [[109,1],[117,7],[119,1],[116,-4],[110,-3]] },                         // Borneo
      { grey: '#34373e', pts: [[95,5],[106,-6],[103,-5],[96,3]] },                                   // Sumatra
      { grey: '#4a4e57', pts: [[-180,-72],[-120,-74],[-60,-66],[0,-70],[60,-67],[120,-66],[180,-72],[180,-90],[-180,-90]] }, // Antarctica
    ];
    // paint a flat world map once (longitude across, latitude down)
    const MAP_W = 720, MAP_H = 360, OCEAN = '#5b606a';
    const mapCanvas = document.createElement('canvas');
    mapCanvas.width = MAP_W; mapCanvas.height = MAP_H;
    const mapCtx = mapCanvas.getContext('2d');
    mapCtx.fillStyle = OCEAN;
    mapCtx.fillRect(0, 0, MAP_W, MAP_H);
    CONTINENTS.forEach(c => {
      mapCtx.fillStyle = c.grey;
      mapCtx.beginPath();
      c.pts.forEach(([lon, lat], i) => {
        const x = (lon + 180) / 360 * MAP_W, y = (90 - lat) / 180 * MAP_H;
        i ? mapCtx.lineTo(x, y) : mapCtx.moveTo(x, y);
      });
      mapCtx.closePath();
      mapCtx.fill();
    });
    const mapPixels = mapCtx.getImageData(0, 0, MAP_W, MAP_H).data;

    // the globe is drawn into a small canvas, pixel by pixel, then scaled up
    const EARTH_SPIN = 6;     // degrees per second
    const EARTH_DETAIL = 0.75; // pixels per screen pixel (lower = faster)
    const globeCanvas = document.createElement('canvas');
    const globeCtx = globeCanvas.getContext('2d');
    let globeCache = null;

    function drawEarth(ctx, alpha, dpr) {
      const W = innerWidth, H = innerHeight;
      // the globe rises from the bottom; its top sits about a third of the way up
      const R = Math.max(H * 0.36 / 0.65, Math.min(W, H) * 0.6);
      const cx = W / 2, cy = H * 0.64 + R;
      const q = EARTH_DETAIL * dpr;
      const gw = Math.ceil(2 * R * q), gh = Math.ceil((H - (cy - R)) * q);

      // work out, once per size, which point of the globe each pixel shows
      if (!globeCache || globeCache.gw !== gw || globeCache.gh !== gh) {
        globeCanvas.width = gw; globeCanvas.height = gh;
        const img = globeCtx.createImageData(gw, gh);
        const row = new Int32Array(gw * gh).fill(-1), lonDeg = new Float32Array(gw * gh), light = new Float32Array(gw * gh);
        const L = [-0.45, 0.55, 0.7], Ll = Math.hypot(...L);
        for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
          const u = (i + 0.5) / q / R - 1, v = 1 - (j + 0.5) / q / R;
          const rr = u * u + v * v;
          if (rr > 1) continue;
          const z = Math.sqrt(1 - rr), k = j * gw + i;
          const lat = Math.asin(v) * 180 / Math.PI;
          row[k] = Math.min(MAP_H - 1, Math.max(0, Math.floor((90 - lat) / 180 * MAP_H)));
          lonDeg[k] = Math.atan2(u, z) * 180 / Math.PI;
          const d = Math.max(0, (u * L[0] + v * L[1] + z * L[2]) / Ll);
          light[k] = (0.45 + 0.75 * d) * (0.75 + 0.25 * z);   // darker towards the edge
        }
        globeCache = { gw, gh, img, row, lonDeg, light };
      }

      const { img, row, lonDeg, light } = globeCache, px = img.data;
      const lon0 = performance.now() / 1000 * EARTH_SPIN;
      for (let k = 0; k < row.length; k++) {
        if (row[k] < 0) { px[k * 4 + 3] = 0; continue; }
        let lon = (lonDeg[k] + lon0 + 180) % 360;
        const col = Math.floor(lon / 360 * MAP_W) % MAP_W;
        const m = (row[k] * MAP_W + col) * 4, s = light[k];
        px[k * 4] = mapPixels[m] * s; px[k * 4 + 1] = mapPixels[m + 1] * s; px[k * 4 + 2] = mapPixels[m + 2] * s;
        px[k * 4 + 3] = 255;
      }
      globeCtx.putImageData(img, 0, 0);

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalAlpha = alpha;
      // a soft glow of atmosphere round the edge
      const glow = ctx.createRadialGradient(cx, cy, R * 0.98, cx, cy, R * 1.12);
      glow.addColorStop(0, 'rgba(170,190,220,0.35)');
      glow.addColorStop(1, 'rgba(170,190,220,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.12, 0, Math.PI * 2); ctx.fill();
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(globeCanvas, cx - R, cy - R, gw / q, gh / q);
      ctx.restore();
    }

    function drawCities(dt) {
      const dpr = Math.min(devicePixelRatio, 2);
      const W = innerWidth, H = innerHeight;
      cityCtx.setTransform(1, 0, 0, 1, 0, 0);
      cityCtx.clearRect(0, 0, cityCanvas.width, cityCanvas.height);
      drawRocket(cityCtx, dt, dpr);   // drawn first, so it rises from behind the buildings
      const u = (H * SKYLINE_HEIGHT / 330) * dpr;           // size of one city unit
      cityCtx.setTransform(u, 0, 0, u, (W / 2) * dpr, H * dpr);
      const colour = '#' + cityState.colour.getHexString();

      Object.entries(cityState.mix).forEach(([name, alpha]) => {
        if (alpha < 0.01) return;
        if (name === 'earth') { drawEarth(cityCtx, alpha, dpr); return; }
        const city = CITIES[name];
        cityCtx.globalAlpha = alpha;
        cityCtx.fillStyle = colour;
        cityCtx.strokeStyle = colour;
        cityCtx.fill(city.path);
        city.wheels.forEach(w => drawWheel(cityCtx, w));
        if (cityState.windows > 0.01) {
          cityCtx.globalAlpha = alpha * cityState.windows;
          cityCtx.fillStyle = WINDOW_COLOUR;
          city.windows.forEach(([x, y]) => cityCtx.fillRect(x, -y - 4, 3, 4));
        }
      });
      cityCtx.globalAlpha = 1;
    }

    // ============================================================
    //  1. SCENE, CAMERA, RENDERER
    // ============================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights: soft light from the sky + a "sun" for shading
    const skyLight = new THREE.HemisphereLight(0xffffff, 0x8a7fb0, 0.9);
    scene.add(skyLight);
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(3, 5, 6);
    scene.add(sun);

    // ============================================================
    //  2. BUILDING BLOCKS for the animals
    //     (x = nose direction, y = up, z = towards you)
    // ============================================================
    const mat = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.6 });

    // Each helper adds one shape to a group g.
    function ball(g, r, material, x, y, z, sx = 1, sy = 1, sz = 1) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), material);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      g.add(m);
      return m;
    }
    // a cone; by default it points up (+y)
    function cone(g, r, h, material, x, y, z, rotX = 0, rotZ = 0) {
      const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 24), material);
      m.position.set(x, y, z);
      m.rotation.set(rotX, 0, rotZ);
      g.add(m);
      return m;
    }
    // a cylinder (legs, whiskers); by default it stands upright
    function stick(g, r, h, material, x, y, z, rotX = 0, rotZ = 0) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), material);
      m.position.set(x, y, z);
      m.rotation.set(rotX, 0, rotZ);
      g.add(m);
      return m;
    }
    function legs(g, material, r, h, y, spots) {
      spots.forEach(([x, z]) => stick(g, r, h, material, x, y, z));
    }
    // a pair of shapes mirrored left/right (z and -z)
    function pair(fn) { fn(1); fn(-1); }

    const POINT_X = -Math.PI / 2;   // rotate a cone so it points along +x (the nose direction)

    // ------------------------------------------------------------
    //  THE HIPPO
    // ------------------------------------------------------------
    function buildHippo() {
      const g = new THREE.Group();
      const purple = mat(0xa796d4), dark = mat(0x8f7fb8), lilac = mat(0xc7bbe8);
      const pink = mat(0xf2a7b8), white = mat(0xffffff), black = mat(0x2b2140);

      ball(g, 1.0,  purple, -0.35, 0,    0, 1, 0.75, 0.75);    // body
      ball(g, 0.6,  lilac,  -0.25,-0.25, 0, 1.2, 0.6, 0.9);    // belly
      ball(g, 0.55, purple,  0.6,  0.3,  0);                   // head
      ball(g, 0.5,  lilac,   1.0,  0.1,  0, 0.75, 0.65, 0.95); // snout
      pair(s => {
        ball(g, 0.06, black, 1.37, 0.28, 0.15 * s);            // nostrils
        ball(g, 0.12, white, 0.7,  0.7,  0.25 * s);            // eyes
        ball(g, 0.06, black, 0.8,  0.72, 0.27 * s);            // pupils
        ball(g, 0.13, dark,  0.45, 0.85, 0.33 * s, 0.6, 1, 1); // ears
        ball(g, 0.07, pink,  0.5,  0.86, 0.35 * s, 0.4, 1, 1); // inner ears
        ball(g, 0.1,  pink,  0.85, 0.35, 0.45 * s, 1, 0.6, 0.4); // cheeks
      });
      ball(g, 0.12, dark, -1.35, 0.15, 0);                     // tail
      legs(g, dark, 0.21, 0.6, -0.6, [[0.2, 0.4], [0.2, -0.4], [-0.85, 0.4], [-0.85, -0.4]]);
      return g;
    }

    // ------------------------------------------------------------
    //  THE FOX
    // ------------------------------------------------------------
    function buildFox() {
      const g = new THREE.Group();
      const orange = mat(0xe8762c), cream = mat(0xfff1dd), dark = mat(0x3a2a2a);
      const black = mat(0x1c1414), white = mat(0xffffff);

      ball(g, 0.9,  orange, -0.3, 0,    0, 1, 0.58, 0.55);     // body
      ball(g, 0.45, cream,  0.05,-0.15, 0, 1, 0.6, 0.8);       // chest
      ball(g, 0.45, orange,  0.65, 0.35, 0);                   // head
      cone(g, 0.24, 0.6, orange, 1.15, 0.25, 0, 0, POINT_X);   // pointy snout
      ball(g, 0.2,  cream,   0.95, 0.18, 0, 1.2, 0.6, 1);      // white muzzle
      ball(g, 0.07, black,   1.45, 0.25, 0);                   // nose
      pair(s => {
        cone(g, 0.15, 0.42, orange, 0.55, 0.88, 0.22 * s);     // ears
        cone(g, 0.07, 0.16, dark,   0.55, 1.03, 0.22 * s);     // dark ear tips
        ball(g, 0.08, white, 0.95, 0.48, 0.2 * s);             // eyes
        ball(g, 0.045, black, 1.0, 0.49, 0.22 * s);            // pupils
        ball(g, 0.2, cream, 0.7, 0.2, 0.28 * s, 1, 0.7, 0.6);  // white cheeks
      });
      legs(g, dark, 0.11, 0.6, -0.6, [[0.25, 0.28], [0.25, -0.28], [-0.75, 0.28], [-0.75, -0.28]]);
      // the big bushy tail with a white tip
      const tail = ball(g, 0.5, orange, -1.35, 0.15, 0, 1.3, 0.55, 0.55);
      tail.rotation.z = 0.35;
      ball(g, 0.25, cream, -1.95, 0.38, 0, 1.2, 0.9, 0.9);
      return g;
    }

    // ------------------------------------------------------------
    //  THE CAT
    // ------------------------------------------------------------
    function buildCat() {
      const g = new THREE.Group();
      const grey = mat(0x6e7180), white = mat(0xf4f4f6), pink = mat(0xf2a7b8);
      const green = mat(0x7fd36b), black = mat(0x15161c), whisker = mat(0xeeeeee);

      ball(g, 0.85, grey,  -0.3, 0,    0, 1, 0.6, 0.55);       // body
      ball(g, 0.4,  white, 0.05,-0.18, 0, 1, 0.6, 0.8);        // white chest
      ball(g, 0.52, grey,  0.6,  0.38, 0, 1, 0.92, 1);         // round head
      pair(s => {
        ball(g, 0.15, white, 1.0, 0.24, 0.1 * s);              // puffy muzzle
        cone(g, 0.16, 0.34, grey, 0.5, 0.92, 0.3 * s, 0, 0);   // ears
        cone(g, 0.08, 0.18, pink, 0.55, 0.88, 0.3 * s, 0, 0);  // pink inner ears
        ball(g, 0.11, green, 0.95, 0.5, 0.2 * s, 0.6, 1, 1);   // big green eyes
        ball(g, 0.05, black, 1.01, 0.5, 0.2 * s, 0.6, 1.6, 0.6); // slit pupils
        // whiskers, two on each side
        stick(g, 0.008, 0.6, whisker, 1.05, 0.27, 0.38 * s, 0.2 * s, Math.PI / 2 + 0.1);
        stick(g, 0.008, 0.6, whisker, 1.05, 0.21, 0.38 * s, 0.2 * s, Math.PI / 2 - 0.1);
      });
      ball(g, 0.06, pink, 1.13, 0.33, 0);                      // little pink nose
      legs(g, grey, 0.11, 0.55, -0.6, [[0.2, 0.25], [0.2, -0.25], [-0.75, 0.25], [-0.75, -0.25]]);
      pair(s => ball(g, 0.12, white, 0.2, -0.88, 0.25 * s, 1, 0.5, 1)); // white front paws
      // a long tail curling upwards, made of small balls along a curve
      for (let i = 0; i < 12; i++) {
        const t = i / 11;
        const a = Math.PI * 0.9 * t;
        ball(g, 0.1 - t * 0.02, grey, -1.1 - Math.sin(a) * 0.45, 0.05 + (1 - Math.cos(a)) * 0.55, 0);
      }
      return g;
    }

    // ------------------------------------------------------------
    //  THE SHE-WOLF
    // ------------------------------------------------------------
    function buildWolf() {
      const g = new THREE.Group();
      const grey = mat(0x9aa0aa), light = mat(0xe3e5ea), darkGrey = mat(0x5d636e);
      const amber = mat(0xf2b33d), black = mat(0x15161c);

      ball(g, 0.95, grey,  -0.35, 0.02, 0, 1.1, 0.55, 0.52);   // slender body
      ball(g, 0.75, darkGrey,-0.4, 0.16, 0, 1.05, 0.38, 0.4);  // darker back
      ball(g, 0.42, light,  0.1,-0.12, 0, 1, 0.75, 0.75);      // pale chest ruff
      ball(g, 0.42, grey,   0.7, 0.42, 0, 1.05, 0.95, 0.9);    // head
      cone(g, 0.2, 0.7, grey, 1.2, 0.3, 0, 0, POINT_X);        // long, fine muzzle
      ball(g, 0.17, light, 1.05, 0.22, 0, 1.6, 0.55, 0.9);     // pale underside of muzzle
      ball(g, 0.065, black, 1.55, 0.3, 0);                     // nose
      pair(s => {
        cone(g, 0.12, 0.42, grey, 0.6, 0.92, 0.2 * s);         // tall pointed ears
        cone(g, 0.06, 0.22, light, 0.63, 0.88, 0.2 * s);       // pale inner ears
        ball(g, 0.075, amber, 1.0, 0.55, 0.19 * s, 0.7, 0.8, 1); // amber eyes
        ball(g, 0.035, black, 1.05, 0.55, 0.21 * s);           // pupils
        ball(g, 0.18, light, 0.78, 0.3, 0.28 * s, 1, 0.7, 0.6); // pale cheeks
      });
      legs(g, grey, 0.1, 0.75, -0.65, [[0.25, 0.25], [0.25, -0.25], [-0.85, 0.25], [-0.85, -0.25]]);
      // bushy tail hanging gently down
      const tail = ball(g, 0.42, grey, -1.5, -0.2, 0, 1.4, 0.48, 0.48);
      tail.rotation.z = -0.5;
      ball(g, 0.2, darkGrey, -2.0, -0.5, 0, 1.2, 0.8, 0.8);    // dark tail tip
      return g;
    }

    // ------------------------------------------------------------
    //  THE ST BERNARD
    // ------------------------------------------------------------
    function buildStBernard() {
      const g = new THREE.Group();
      const white = mat(0xf4efe6), brown = mat(0x9b4f1f), dark = mat(0x2a1a10);
      const wood = mat(0xb07a3c), band = mat(0x5a3a1e);

      ball(g, 1.0,  white, -0.3, 0,    0, 1, 0.62, 0.62);      // big body
      ball(g, 0.85, brown, -0.42, 0.2, 0, 1, 0.5, 0.66);       // brown saddle on the back
      ball(g, 0.5,  white,  0.25,-0.05, 0);                    // white chest
      ball(g, 0.5,  brown,  0.75, 0.45, 0, 1, 0.9, 0.95);      // head
      ball(g, 0.13, white,  1.05, 0.7, 0, 1, 1.5, 0.45);       // white stripe on the forehead
      ball(g, 0.3,  white,  1.12, 0.3, 0, 1.1, 0.75, 1);       // muzzle
      ball(g, 0.08, dark,   1.43, 0.38, 0);                    // nose
      pair(s => {
        ball(g, 0.15, white, 1.12, 0.17, 0.14 * s);            // droopy jowls
        ball(g, 0.06, dark,  1.1, 0.6, 0.19 * s);              // eyes
        ball(g, 0.2,  brown, 0.62, 0.42, 0.43 * s, 0.8, 1.4, 0.4); // floppy ears
      });
      legs(g, white, 0.17, 0.6, -0.68, [[0.25, 0.32], [0.25, -0.32], [-0.85, 0.32], [-0.85, -0.32]]);
      const tail = ball(g, 0.3, brown, -1.4, 0.0, 0, 1.3, 0.45, 0.45);
      tail.rotation.z = -0.45;
      ball(g, 0.14, white, -1.72, -0.18, 0);                   // white tail tip
      // the famous little barrel under the chin
      stick(g, 0.11, 0.32, wood, 0.8, -0.2, 0, Math.PI / 2);
      pair(s => stick(g, 0.118, 0.04, band, 0.8, -0.2, 0.1 * s, Math.PI / 2));
      return g;
    }

    // ------------------------------------------------------------
    //  THE PANGOLIN
    // ------------------------------------------------------------
    function buildPangolin() {
      const g = new THREE.Group();
      const skin = mat(0xc9a27a), scaleA = mat(0x7a5a38), scaleB = mat(0x93704a);
      const black = mat(0x1a120c), claw = mat(0x3a2a1c);

      ball(g, 1.0, skin, -0.2, 0, 0, 1.05, 0.55, 0.5);          // body
      // armour: rows of flat scales laid over the back and sides
      let row = 0;
      for (let x = -1.05; x <= 0.65; x += 0.2, row++) {
        const f = Math.sqrt(Math.max(0, 1 - ((x + 0.2) / 1.1) ** 2));
        for (let deg = -100 + (row % 2) * 12.5; deg <= 100; deg += 25) {
          const a = deg * Math.PI / 180;
          const plate = ball(g, 0.17, (row + Math.round(deg / 25)) % 2 ? scaleA : scaleB,
            x, 0.56 * f * Math.cos(a), 0.51 * f * Math.sin(a), 1.25, 0.32, 1);
          plate.rotation.x = a;                                  // lie flat on the body
        }
      }
      // long scaly tail curving down behind
      for (let i = 0; i < 9; i++) {
        const t = i / 8, r = 0.34 - t * 0.22;
        ball(g, r, i % 2 ? scaleA : scaleB, -1.25 - t * 1.0, -0.05 - t * t * 0.45, 0, 1.2, 0.75, 1);
      }
      // small pointed head
      ball(g, 0.3, skin, 0.92, -0.08, 0, 1.25, 0.8, 0.85);
      cone(g, 0.12, 0.38, skin, 1.38, -0.12, 0, 0, POINT_X);    // long snout
      ball(g, 0.04, black, 1.57, -0.12, 0);                     // nose tip
      pair(s => {
        ball(g, 0.045, black, 1.08, 0.04, 0.18 * s);            // tiny eyes
        ball(g, 0.15, skin, 0.35, -0.42, 0.28 * s, 1, 1.4, 1);  // front legs
        ball(g, 0.15, skin, -0.75, -0.42, 0.28 * s, 1, 1.4, 1); // back legs
        cone(g, 0.04, 0.16, claw, 0.48, -0.6, 0.28 * s, 0, POINT_X);  // big digging claws
        cone(g, 0.04, 0.16, claw, -0.62, -0.6, 0.28 * s, 0, POINT_X);
      });
      return g;
    }

    // Centre each animal on its middle and measure how far it reaches,
    // so every animal bounces exactly off the screen edges.
    function prepare(name, group) {
      const box = new THREE.Box3().setFromObject(group);
      const centre = box.getCenter(new THREE.Vector3());
      group.children.forEach(c => c.position.sub(centre));
      const sphere = new THREE.Box3().setFromObject(group).getBoundingSphere(new THREE.Sphere());
      const feet = new THREE.Box3().setFromObject(group).min.y;   // lowest point, for standing on the globe
      return { name, group, radius: sphere.radius, feet };
    }

    // The order the animals appear in
    // name tag, 3D model, which city skyline appears behind it, and squeak pitch
    const ANIMALS = [
      { ...prepare('Hip',      buildHippo()), city: 'singapore', pitch: 0.8 },  // the hippo
      { ...prepare('Mimu',     buildFox()),   city: 'singapore', pitch: 1.15 }, // the fox
      { ...prepare('Sasa',     buildCat()),   city: 'london', pitch: 1.35 },    // the cat
      { ...prepare('Minouche', buildWolf()),  city: 'singapore', pitch: 1.0 }, // the she-wolf
      { ...prepare('Paps',     buildStBernard()), city: 'paris', pitch: 0.7 },  // the St Bernard
      { ...prepare('Tints',    buildPangolin()),  city: 'paris', pitch: 1.25 }, // the pangolin
    ];
    // each animal spins inside a "holder" that carries its position, size and lean
    ANIMALS.forEach(a => { a.holder = new THREE.Group(); a.holder.add(a.group); });

    let animalIndex = 0;
    let animal = ANIMALS[0];   // the animal whose turn it is
    let party = false;         // true during the all-together finale
    let partyCycles = 0;

    const nameTag = document.getElementById('nameTag');
    let nameTimer;
    function showName(text) {
      nameTag.textContent = text;
      nameTag.classList.add('show');
      clearTimeout(nameTimer);
      nameTimer = setTimeout(() => nameTag.classList.remove('show'), 1800);
    }

    // ============================================================
    //  3. SCREEN SIZE IN 3D UNITS (so we know where the walls are)
    // ============================================================
    let viewW, viewH, scale;
    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      viewH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      viewW = viewH * camera.aspect;
      scale = Math.min(viewW, viewH) * ANIMAL_SIZE;
      const dpr = Math.min(devicePixelRatio, 2);
      cityCanvas.width = innerWidth * dpr;
      cityCanvas.height = innerHeight * dpr;
      cityCanvas.style.width = innerWidth + 'px';
      cityCanvas.style.height = innerHeight + 'px';
    }
    addEventListener('resize', resize);
    resize();

    // ============================================================
    //  4. BOUNCING BODIES
    //     Each animal on screen is a "body" with its own position,
    //     speed, spin, squish and size.
    // ============================================================
    const rand = (a, b) => a + Math.random() * (b - a);
    const randomSpin = () => rand(0.6, SPIN_MAX) * (Math.random() < 0.5 ? -1 : 1);

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const motion = reduceMotion ? 0.35 : 1;
    const baseSpeed = () => viewH / SPEED * 1.28;

    function makeBody(a, x, y, angle, popStart) {
      const sp = baseSpeed();
      return {
        animal: a,
        pos: { x, y },
        vel: { x: Math.cos(angle) * sp, y: Math.sin(angle) * sp },
        // spin speed around each axis: x = horizontal, y = vertical, z = depth
        spin: { x: randomSpin(), y: randomSpin(), z: randomSpin() },
        squash: 0,
        pop: popStart,   // goes 0 → 1 when the animal appears
        grow: 1,         // 1 = full size, smaller during the finale
        R: 0,            // how far it reaches (worked out every frame)
      };
    }
    function newSpin(b) { b.spin.x = randomSpin(); b.spin.y = randomSpin(); b.spin.z = randomSpin(); }
    // after every bounce, the speed changes at random to within ±10% of the normal speed
    const SPEED_WOBBLE = 0.10;
    function newSpeed(b) {
      const now = Math.hypot(b.vel.x, b.vel.y) || 1;
      const k = baseSpeed() * rand(1 - SPEED_WOBBLE, 1 + SPEED_WOBBLE) / now;
      b.vel.x *= k; b.vel.y *= k;
    }

    let bodies = [makeBody(animal, 0, 0, Math.atan2(0.8, 1), 1)];
    scene.add(animal.holder);
    const isHip = b => b.animal === ANIMALS[0];

    // the next animal takes over the single bouncing body
    function nextAnimal() {
      const b = bodies[0];
      const old = b.animal.group;
      scene.remove(b.animal.holder);
      animalIndex = (animalIndex + 1) % ANIMALS.length;
      animal = ANIMALS[animalIndex];
      animal.group.rotation.copy(old.rotation);   // carry on tumbling the same way
      scene.add(animal.holder);
      b.animal = animal;
      b.pop = 0;
      showName(animal.name);
    }

    // the finale: everyone joins in, above the Earth
    function startParty() {
      party = true;
      partyCycles = 0;
      const R = 1.45 * scale * PARTY_SIZE;
      ANIMALS.forEach((a, i) => {
        if (bodies.some(b => b.animal === a)) return;   // already on screen
        let x = 0, y = 0;
        for (let tries = 0; tries < 300; tries++) {      // find a free spot
          x = rand(-viewW / 2 + R, viewW / 2 - R);
          y = rand(-viewH / 2 + R, viewH / 2 - R);
          if (bodies.every(b => Math.hypot(b.pos.x - x, b.pos.y - y) > b.R + R * 1.3)) break;
        }
        let angle;
        do { angle = rand(0, Math.PI * 2); } while (Math.abs(Math.cos(angle)) < 0.3 || Math.abs(Math.sin(angle)) < 0.3);
        const b = makeBody(a, x, y, angle, -0.12 * bodies.length);   // pop in one after another
        b.grow = PARTY_SIZE;
        a.group.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
        scene.add(a.holder);
        bodies.push(b);
      });
      showName('All together!');
    }

    // ------------------------------------------------------------
    //  DANCING: moves timed to the beat of the music
    // ------------------------------------------------------------
    const DANCE_SECONDS = 5;   // how long the line-up dances before it all starts again
    function beatNow(bpm) {
      if (audio && soundOn && music.name && music.t0 !== undefined) {
        return (audio.currentTime - music.t0) * SONGS[music.name].bpm / 60;
      }
      return performance.now() / 1000 * bpm / 60;
    }
    // returns a little hop, a squish and a sway for this moment of the beat
    function danceMove(beat, style) {
      const f = beat % 1, bar = beat % 8;
      const hop = Math.sin(Math.PI * f) ** 2;                    // up and down on every beat
      const land = Math.max(0, 1 - f * 5);                       // squish as the beat lands
      let turn = Math.sin(Math.PI * beat / 2) * 0.55;            // look left and right every two beats
      let wiggle = Math.sin(Math.PI * beat) * 0.18;
      if (style % 2) { turn *= -1; wiggle *= -1; }                // neighbours mirror each other
      if (bar >= 7) turn += (bar - 7) * Math.PI * 2;             // a full twirl at the end of every 8 beats
      return { hop, land, turn, wiggle };
    }

    // ------------------------------------------------------------
    //  THE LINE-UP: everyone lands in a row on the globe and dances
    // ------------------------------------------------------------
    let finale = null;   // { stage: 'landing' | 'dance', t, grow }
    function startFinale() {
      // the same globe drawEarth paints, measured in 3D units
      const W = innerWidth, H = innerHeight;
      const Rpx = Math.max(H * 0.36 / 0.65, Math.min(W, H) * 0.6), cyPx = H * 0.64 + Rpx;
      const toWorld = viewH / H, Rg = Rpx * toWorld, cyG = (H / 2 - cyPx) * toWorld;
      // spread the six around the top of the globe, keeping them on screen
      const gap = Math.min(22 * Math.PI / 180, Math.asin(Math.min(1, viewW * 0.45 / Rg)) / 2.5);
      const grow = Math.min(PARTY_SIZE, Rg * gap / (2.05 * 1.45 * scale));   // shrink so they fit
      finale = { stage: 'landing', t: 0, grow };
      bodies.sort((a, b) => ANIMALS.indexOf(a.animal) - ANIMALS.indexOf(b.animal));
      bodies.forEach((b, i) => {
        const angle = (i - (bodies.length - 1) / 2) * gap;   // 0 = top of the globe
        const size = scale * grow * (1.45 / b.animal.radius);
        const lift = Rg - b.animal.feet * size;               // feet on the ground
        b.from = { x: b.pos.x, y: b.pos.y };
        b.slot = { x: Math.sin(angle) * lift, y: cyG + Math.cos(angle) * lift,
                   upX: Math.sin(angle), upY: Math.cos(angle), tilt: -angle };
        // turn to face the viewer by the shortest way round
        const r = b.animal.group.rotation, wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
        b.fromRot = { x: wrap(r.x - 0.12) + 0.12, y: wrap(r.y - FACE_VIEWER) + FACE_VIEWER, z: wrap(r.z) };
        b.vel.x = b.vel.y = 0;
      });
      showName('Dance party!');
    }

    // back to the very beginning: Hip alone in the middle, waiting for a swipe
    function resetToStart() {
      finale = null;
      party = false;
      started = false;
      swipe = null;
      const hip = bodies.find(isHip);
      bodies.forEach(b => { if (b !== hip) scene.remove(b.animal.holder); });
      bodies = [hip];
      hip.pos.x = hip.pos.y = 0;
      hip.vel.x = hip.vel.y = 0;
      hip.pop = 0;
      animalIndex = 0;
      animal = ANIMALS[0];
      skyIndex = 0;
      showSky(0);
      document.getElementById('intro').classList.remove('gone');
      document.getElementById('hint').hidden = true;
    }

    // ============================================================
    //  5. CHANGING THE SKY
    // ============================================================
    let skyIndex = 0;
    const target = {                          // the light we are fading towards
      sky: new THREE.Color(), ground: new THREE.Color(), sun: new THREE.Color(), sunPower: 0.8,
    };
    function showSky(i) {
      document.querySelectorAll('.sky').forEach(el => el.classList.remove('active'));
      const s = SKIES[i];
      document.getElementById(s.id).classList.add('active');
      target.sky.setHex(s.sky);
      target.ground.setHex(s.ground);
      target.sun.setHex(s.sun);
      target.sunPower = s.sunPower;
      if (s.id === 'night') launchRocket();   // night time: launch the rocket!
    }
    function nextSky() {
      skyIndex = (skyIndex + 1) % SKIES.length;
      showSky(skyIndex);
      if (skyIndex !== 0) return;
      // a full sky cycle is done:
      if (party) {
        if (++partyCycles >= PARTY_CYCLES && !finale) startFinale();   // time to line up
      } else if (animalIndex === ANIMALS.length - 1) {
        startParty();                                       // everyone has had a turn
      } else {
        nextAnimal();                                       // next animal's turn
      }
    }
    showSky(0);
    skyLight.color.copy(target.sky);
    skyLight.groundColor.copy(target.ground);
    sun.color.copy(target.sun);

    // ============================================================
    //  5b. THE OPENING: Hip waits, facing you, until you swipe
    // ============================================================
    let started = false;
    let swipe = null;   // where the finger went down
    const FACE_VIEWER = -Math.PI / 2;   // turns Hip's nose towards the screen

    addEventListener('pointerdown', e => {
      if (!started) { swipe = { x: e.clientX, y: e.clientY, t: performance.now() }; return; }
      bodies.forEach(newSpin);   // after the start, a tap only changes the spin
    });
    addEventListener('pointermove', e => {
      if (started || !swipe) return;
      swipe.lean = Math.max(-1, Math.min(1, (e.clientX - swipe.x) / 120));   // Hip leans with your finger
    });
    addEventListener('pointerup', e => {
      if (started || !swipe) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      swipe = null;
      if (Math.hypot(dx, dy) < 30) return;   // too small: that was a tap, not a swipe
      launch(dx, -dy);                        // screen y points down, the 3D world's y points up
    });
    addEventListener('pointercancel', () => { swipe = null; });

    function launch(dx, dy) {
      // never perfectly flat or upright, or he'd only bounce between two walls
      let angle = Math.atan2(dy, dx);
      const min = 12 * Math.PI / 180;
      const toAxis = a => { const r = ((a % (Math.PI / 2)) + Math.PI / 2) % (Math.PI / 2); return Math.min(r, Math.PI / 2 - r); };
      if (toAxis(angle) < min) angle += min;
      const b = bodies[0];
      const sp = baseSpeed();
      b.vel.x = Math.cos(angle) * sp;
      b.vel.y = Math.sin(angle) * sp;
      newSpin(b);
      b.squash = 1;
      squeak(b.animal.pitch);
      hapticWall();   // during your swipe, when phones most readily allow it
      started = true;
      document.getElementById('intro').classList.add('gone');
      document.getElementById('hint').hidden = false;
      showName(animal.name);
    }

    // a springy "pop" curve: 0 → overshoots a little → settles at 1
    const popCurve = t => 1 - Math.cos(t * Math.PI * 2.5) * Math.exp(-t * 5);

    // ============================================================
    //  6. ANIMATION LOOP (runs ~60 times per second)
    // ============================================================
    let last = performance.now();
    function frame(now) {
      const realDt = Math.min((now - last) / 1000, 0.05);
      const dt = realDt * motion * speedFactor;
      last = now;

      let changeSky = false;
      bodies.forEach(b => {
        b.grow += ((finale ? finale.grow : party ? PARTY_SIZE : 1) - b.grow) * Math.min(1, realDt * 3);
        b.R = 1.45 * scale * b.grow;
        if (!started || finale) return;   // waiting for the swipe, or lining up: no bouncing
        b.pos.x += b.vel.x * dt;
        b.pos.y += b.vel.y * dt;

        // walls (a corner hit counts as one bounce)
        const maxX = viewW / 2 - b.R, maxY = viewH / 2 - b.R;
        let hit = false;
        if (b.pos.x >  maxX) { b.pos.x =  maxX; b.vel.x = -Math.abs(b.vel.x); hit = true; }
        if (b.pos.x < -maxX) { b.pos.x = -maxX; b.vel.x =  Math.abs(b.vel.x); hit = true; }
        if (b.pos.y >  maxY) { b.pos.y =  maxY; b.vel.y = -Math.abs(b.vel.y); hit = true; }
        if (b.pos.y < -maxY) { b.pos.y = -maxY; b.vel.y =  Math.abs(b.vel.y); hit = true; }
        if (hit) {
          b.squash = 1;
          newSpin(b);
          newSpeed(b);
          squeak(b.animal.pitch);
          hapticWall();
          // alone: every wall hit changes the sky. Finale: only Hip's wall hits do.
          if (!party || isHip(b)) changeSky = true;
        }
      });

      // animals bumping into each other
      for (let i = 0; i < bodies.length && !finale; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const a = bodies[i], c = bodies[j];
          if (a.pop <= 0 || c.pop <= 0) continue;   // not arrived yet
          const dx = c.pos.x - a.pos.x, dy = c.pos.y - a.pos.y;
          const d = Math.hypot(dx, dy), min = (a.R + c.R) * BUMP_DISTANCE;
          if (d >= min || d === 0) continue;
          const nx = dx / d, ny = dy / d, push = (min - d) / 2;
          a.pos.x -= nx * push; a.pos.y -= ny * push;
          c.pos.x += nx * push; c.pos.y += ny * push;
          const closing = (a.vel.x - c.vel.x) * nx + (a.vel.y - c.vel.y) * ny;
          if (closing > 0) {   // bounce off each other
            a.vel.x -= closing * nx; a.vel.y -= closing * ny;
            c.vel.x += closing * nx; c.vel.y += closing * ny;
            [a, c].forEach(b => { b.squash = 1; newSpin(b); newSpeed(b); });
            plush();
            hapticBump();
          }
        }
      }

      // the line-up: hop into place, then dance, then start again
      if (finale) {
        finale.t += realDt;
        if (finale.stage === 'landing' && finale.t >= 1.4) { finale.stage = 'dance'; finale.t = 0; }
        else if (finale.stage === 'dance' && finale.t >= DANCE_SECONDS) resetToStart();
      }

      // spin, squish, pop, and place each animal
      bodies.forEach((b, i) => {
        const g = b.animal.group, holder = b.animal.holder;
        let x = b.pos.x, y = b.pos.y, squish = b.squash * 0.15, tilt = 0;
        const size = scale * b.grow * (1.45 / b.animal.radius);   // same size for every animal
        if (!started) {
          // the opening: Hip dances in the middle, leaning a little as your finger moves
          const m = danceMove(beatNow(SONGS.Hip.bpm), 0), lean = swipe && swipe.lean ? swipe.lean : 0;
          const amt = reduceMotion ? 0.3 : 1;
          y += m.hop * 0.35 * size * amt;
          squish = Math.max(squish, m.land * 0.12 * amt);
          g.rotation.set(0.12, FACE_VIEWER + m.turn * amt + lean * 0.35, m.wiggle * amt - lean * 0.25);
        } else if (finale && finale.stage === 'landing') {
          // a hop along an arc into its place in the line, turning to face you
          const t = Math.min(1, finale.t / 1.4), e = 1 - (1 - t) ** 3;
          x = b.from.x + (b.slot.x - b.from.x) * e;
          y = b.from.y + (b.slot.y - b.from.y) * e + Math.sin(Math.PI * t) * size * 0.8;
          tilt = b.slot.tilt * e;
          g.rotation.set(b.fromRot.x + (0.12 - b.fromRot.x) * e, b.fromRot.y + (FACE_VIEWER - b.fromRot.y) * e,
                         b.fromRot.z * (1 - e));
          if (t >= 1) squish = 0.15;
        } else if (finale) {
          // dancing in the line, standing straight out from the globe
          const m = danceMove(beatNow(SONGS.party.bpm) + (i % 3) * 0.08, i);
          const hop = m.hop * 0.3 * size;
          x = b.slot.x + b.slot.upX * hop;
          y = b.slot.y + b.slot.upY * hop;
          tilt = b.slot.tilt;
          squish = m.land * 0.12;
          g.rotation.set(0.12, FACE_VIEWER + m.turn, m.wiggle);
        } else {
          g.rotation.x += b.spin.x * dt;
          g.rotation.y += b.spin.y * dt;
          g.rotation.z += b.spin.z * dt;
        }
        b.squash = Math.max(0, b.squash - dt * 5);
        b.pop = Math.min(1, b.pop + realDt * 1.4);
        const p = b.pop <= 0 ? 0.0001 : (reduceMotion ? 1 : popCurve(b.pop));
        const s = 1 - squish;
        holder.scale.set(size * p * (2 - s), size * p * s, size * p * (2 - s));
        holder.position.set(x, y, 0);
        holder.rotation.set(0, 0, tilt);
      });

      if (changeSky) nextSky();

      // fade the animals' lighting towards the current sky
      const k = Math.min(1, realDt * 2.5);
      skyLight.color.lerp(target.sky, k);
      skyLight.groundColor.lerp(target.ground, k);
      sun.color.lerp(target.sun, k);
      sun.intensity += (target.sunPower - sun.intensity) * k;

      // fade the city's colour and lit windows with the sky, and swap cities with the scene
      const sky = SKIES[skyIndex];
      cityState.colour.lerp(new THREE.Color(sky.city), k);
      cityState.windows += (sky.windows - cityState.windows) * k;
      const place = party ? 'earth' : animal.city;
      for (const name in cityState.mix) {           // fade fully across in 1.5 seconds
        const gap = (place === name ? 1 : 0) - cityState.mix[name];
        cityState.mix[name] += Math.sign(gap) * Math.min(Math.abs(gap), realDt / 1.5);
      }
      drawCities(realDt);

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // try to start the music straight away; if the browser says "wait for a tap",
    // the note on screen asks for one and the first touch starts it
    try {
      if (startAudio()) audio.resume().then(() => {
        if (audio.state === 'running' && !userMuted && !soundOn) setSound(true);
      }).catch(() => {});
    } catch (e) {}
  </script>
</body>
</html>
